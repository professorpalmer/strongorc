name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Scripted pass card
        run: |
          strongorc run --slice core --adapter scripted --persona pass --model scripted-pass --out runs/pass.jsonl
          strongorc card runs/pass.jsonl --model scripted-pass --out cards/scripted-pass.json
          strongorc run --slice hard --adapter scripted --persona pass --model scripted-pass --out runs/hard-pass.jsonl
          strongorc card runs/hard-pass.jsonl --model scripted-pass --slice hard --out cards/scripted-hard-pass.json
