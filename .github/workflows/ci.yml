name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # Full pytest is the scripted pass / fail / non-vacuity gate for
        # core, hard, native, ladder, reason (and brutal/frontier). Holdout
        # tests use tests/fixtures/holdout_overlay only — do not set
        # STRONGORC_HOLDOUT.
        run: pytest
      - name: Replicate scripted cards
        run: python scripts/replicate.py
