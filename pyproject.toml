[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strongorc"
version = "0.6.0"
description = "StrongOrc: drop-day evaluation of models as durable orchestrators and as orchestrated workers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Cary Palmer" }]
keywords = ["strongorc", "benchmark", "agents", "orchestration", "durable-state"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
durable-orch = "strongorc.cli:main"
strongorc = "strongorc.cli:main"

[project.urls]
Homepage = "https://github.com/professorpalmer/strongorc"
Repository = "https://github.com/professorpalmer/strongorc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
